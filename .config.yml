# ---------------------
# Publishing configuration
# ---------------------

publish:
  group-id: io.github.mflisar.composetable
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  target: maven-central # [none, maven-central, github]

# ---------------------
# General configuration
# ---------------------

config:
  java-version: 17
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

# ---------------------
# Project
# ---------------------

project:
  namespace: com.michaelflisar.composetable
  repo-name: ComposeTable
  release: 2026
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

# ---------------------
# APPS
# ---------------------

apps:
  - name: Compose Table Demo
    namespace: com.michaelflisar.composetable.demo
    version-name: 1.0.0
    module-paths:
      - demo/app/web
      - demo/app/windows
      - demo/shared
    # optional - if set, the app will be published to the homepage and linked in the readme
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/web

# ---------------------
# Modules
# ---------------------

modules:
  # used to detect latest release version of the library (dynamically on the published homepage)
  primary-artifact-id: core
  # Modules - list of modules [artifact-id, description, path, (plugin), (internal)]
  modules:
    - artifact-id: core
      description: table APIs, state, columns, and data models
      path: library/core
    - artifact-id: material3
      description: Material 3 UI provider
      path: library/implementations/material3
    - artifact-id: styled
      description: ComposeStyled UI provider
      path: library/implementations/styled
  # XCFrameworks [name, path, targets (ios, macos)]
  xcframeworks: []

# ---------------------
# Readme Generation
# ---------------------

documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
    main-screenshot: screenshots/main.png