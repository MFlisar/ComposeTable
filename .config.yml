# ---------------------
# Publishing configuration
# ---------------------

publish:
  group-id: io.github.mflisar.composetable
  github:
    user: MFlisar
    repo: maven-repository
    branch: main
    path: artifacts
  release-target: maven-central
  test-target: github

# ---------------------
# General configuration
# ---------------------

config:
  java-version: 17
  developer:
    name: Michael Flisar
    mail: mflisar.development@gmail.com
    maven-id: mflisar
    github-user-name: MFlisar

# ---------------------
# Project
# ---------------------

project:
  namespace: com.michaelflisar.composetable
  repo-name: ComposeTable
  release: 2026
  license:
    name: Apache License 2.0
    path: blob/main/LICENSE

# ---------------------
# APPS
# ---------------------

apps:
  - name: Compose Table Demo
    namespace: com.michaelflisar.composetable.demo
    version-name: 1.0.0
    module-paths:
      - demo/app/jvm
      - demo/app/wasm
      - demo/shared
    # optional - if set, the app will be published to the homepage and linked in the readme
    publish:
      url-path: demo
      description: Explore the interactive demo
      module-path: demo/app/wasm

# ---------------------
# Modules
# ---------------------

modules:
  # used to detect latest release version of the library (dynamically on the published homepage)
  primary-artifact-id: core
  # Modules - list of modules [artifact-id, description, path, (plugin), (internal)]
  modules:
    - artifact-id: core
      description: core library that does not provide a UI implementation
      path: library/core
      internal: true
    - artifact-id: material3-ui-provider
      description: Material 3 UI provider for manual registration
      path: library/ui-provider/material3
      internal: true
    - artifact-id: styled-ui-provider
      description: Styled UI provider for manual registration
      path: library/ui-provider/styled
      internal: true
    - artifact-id: material3
      description: A compose table implementation that uses [Material 3](https://kotlinlang.org/api/compose-multiplatform/material3/) components
      path: library/implementation/material3
    - artifact-id: styled
      description: A compose table implementation that uses [ComposeStyled](https://github.com/MFlisar/ComposeStyled) components
      path: library/implementation/styled
  # XCFrameworks [name, path, targets (ios, macos)]
  xcframeworks: []

# ---------------------
# Readme Generation
# ---------------------

documentation:
  path: documentation
  relative-paths:
    partials: _partials
    screenshots: screenshots
    main-screenshot: screenshots/main.png